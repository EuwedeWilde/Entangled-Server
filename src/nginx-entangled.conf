# nginx site config for euwedewil.de
# Install to: /etc/nginx/sites-available/entangled
# Then symlink into sites-enabled (see HOSTING steps).
#
# This serves the static files directly, redirects / and /entangled to the
# sandbox, sends the bare domain to www, blocks sensitive dirs, and proxies
# the trainer WebSocket at /wss through to the Python server on port 8765.

server {
    listen 80;
    listen [::]:80;
    server_name www.euwedewil.de euwedewil.de;

    root /root/entangled/src;
    index sandbox.html;

    # Bare domain -> www (canonical host)
    if ($host = euwedewil.de) {
        return 301 $scheme://www.euwedewil.de$request_uri;
    }

    # /entangled (with or without trailing slash) -> the sandbox page
    location = /entangled  { return 301 /sandbox.html; }
    location = /entangled/ { return 301 /sandbox.html; }

    # Root -> the sandbox page
    location = / { return 301 /sandbox.html; }

    # Never serve the venv, backend source, or git data
    location ~ ^/(\.venv|server|\.git)/ { deny all; return 404; }

    # Trainer WebSocket, proxied so wss:// works over the one domain cert
    location /wss {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Everything else: serve the matching static file or 404
    location / {
        try_files $uri $uri/ =404;
    }
}
